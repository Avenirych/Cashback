# Template: rendered only after strict nonsecret origin validation.
worker_processes 1;
pid /tmp/nginx.pid;
# Do not record request URLs, verification tokens, credentials or query strings.
error_log /dev/null crit;
events { worker_connections 128; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 server_tokens off;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 5m;
 client_body_buffer_size 32k;
 client_header_timeout 10s;
 client_body_timeout 15s;
 keepalive_timeout 15s;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 # Health is container-loopback only, never app/static/proxy.
 server {
  listen 127.0.0.1:8081;
  server_name _;
  location = /healthz { return 200 'ok'; }
  location / { return 404; }
 }
 # HTTP is not published. It must never serve the application.
 server {
  listen 8080 default_server;
  server_name _;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  return 308 ${STAGING_FRONTEND_ORIGIN}$request_uri;
 }
 # Unknown SNI and non-SNI clients are refused before HTTP.
 server {
  listen 8443 ssl default_server;
  ssl_reject_handshake on;
 }
 server {
  listen 8443 ssl;
  server_name ${STAGING_FRONTEND_HOST};
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /run/secrets/web_cert;
  ssl_certificate_key /run/secrets/web_key;
  ssl_client_certificate /run/secrets/tester_ca;
  ssl_crl /run/secrets/tester_crl;
  ssl_verify_client on;
  ssl_verify_depth 2;
  ssl_session_cache off;
  ssl_session_tickets off;
  if ($host != ${STAGING_FRONTEND_HOST}) { return 444; }
  include /etc/nginx/staging-security-headers.conf;
  root /usr/share/nginx/html;
  location = /api { return 404; }
  # Preserve JWT; client-certificate gate is separate from application ownership.
  location /api/ {
   proxy_pass http://backend:3001/;
   proxy_set_header Host $host;
   proxy_set_header Authorization $http_authorization;
   proxy_set_header X-Forwarded-Proto https;
   proxy_no_cache 1;
   proxy_cache_bypass 1;
   proxy_max_temp_file_size 0;
   proxy_hide_header Access-Control-Allow-Origin;
   add_header Cache-Control "no-store" always;
   include /etc/nginx/staging-security-headers.conf;
  }
  location /avatars/ { proxy_pass http://backend:3001; }
  location /static/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
