name: ${SYNTH_PROJECT:?Explicit unique synthetic project required}
services:
  pg:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    container_name: ${SYNTH_PROJECT:?Explicit unique synthetic project required}-pg
    labels:
      com.cashback.synthetic.run: ${SYNTH_RUN_ID:?Explicit synthetic run ID required}
      com.cashback.synthetic.scope: disposable-security-v1
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_min_messages=panic
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_duration_sample=-1
      - -c
      - log_statement_sample_rate=0
      - -c
      - log_transaction_sample_rate=0
      - -c
      - log_duration=off
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - debug_print_parse=off
      - -c
      - debug_print_rewritten=off
      - -c
      - debug_print_plan=off
      - -c
      - log_parser_stats=off
      - -c
      - log_planner_stats=off
      - -c
      - log_executor_stats=off
      - -c
      - log_statement_stats=off
      - -c
      - shared_preload_libraries=
      - -c
      - session_preload_libraries=
      - -c
      - local_preload_libraries=
    environment:
      POSTGRES_DB: finance_security_test
      POSTGRES_USER: fs_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - source: synthetic_bootstrap
        target: bootstrap
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
    restart: "no"
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, fs_bootstrap, -d, finance_security_test]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
networks:
  private:
    name: ${SYNTH_PROJECT:?Explicit unique synthetic project required}-private
    internal: true
    labels:
      com.cashback.synthetic.run: ${SYNTH_RUN_ID:?Explicit synthetic run ID required}
      com.cashback.synthetic.scope: disposable-security-v1
volumes:
  pgdata:
    name: ${SYNTH_PROJECT:?Explicit unique synthetic project required}-pgdata
    labels:
      com.cashback.synthetic.run: ${SYNTH_RUN_ID:?Explicit synthetic run ID required}
      com.cashback.synthetic.scope: disposable-security-v1
secrets:
  synthetic_bootstrap:
    name: bootstrap
    file: ${SYNTH_BOOTSTRAP_FILE:?NEW synthetic file only; never existing credentials}
