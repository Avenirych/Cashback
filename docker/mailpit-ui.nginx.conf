worker_processes 1;
pid /tmp/nginx.pid;
# Request diagnostics may contain mailbox capabilities. Do not emit them.
error_log /dev/null;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 5m;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $mailpit_upgrade {
        default "";
        ~*^websocket$ websocket;
    }
    map $mailpit_upgrade $mailpit_connection {
        default close;
        websocket upgrade;
    }
    map $host $local_ui_host {
        default 0;
        localhost 1;
        127.0.0.1 1;
    }

    server {
        listen 8025;
        server_name localhost 127.0.0.1;
        if ($local_ui_host = 0) { return 444; }
        if ($request_method = CONNECT) { return 405; }

        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        location / {
            # Fixed HTTP upstream: no user-selected destination or SMTP tunnel.
            proxy_pass http://mailpit:8025;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $mailpit_upgrade;
            proxy_set_header Connection $mailpit_connection;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
